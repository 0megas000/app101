<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link rel="icon" href="/favicon.svg" />
    <title>Pre-Workout Bar</title>
    <script>
      // Apply the saved theme before first paint so a reload never flashes
      // the wrong palette. Mirrors THEME_BOOTSTRAP in src/design/theme.tsx.
      try {
        var t = localStorage.getItem("pwx-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
